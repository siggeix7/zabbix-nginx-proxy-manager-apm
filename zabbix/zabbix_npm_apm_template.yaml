    - uuid: bc34ce4d69cc4715afd6d9dff4c9a720
      name: 'Zabbix APM Nginx Proxy Manager: Proxy hosts discovery'
      type: SCRIPT
      key: apm.npm.proxyhosts.discovery
      delay: 1h
      params: |-
        var p = JSON.parse(value);
        if (!p.host || p.host === '{HOST.HOST}') {
            throw 'Il nome tecnico host Zabbix non e stato risolto';
        }
        if (!p.url || !/^https?:\/\//.test(p.url)) {
            throw 'Macro {$NPM.CH.URL} non valida';
        }
        if (!p.database || !/^[A-Za-z_][A-Za-z0-9_]*$/.test(p.database)) {
            throw 'Macro {$NPM.CH.DATABASE} non valida';
        }
        if (!p.user || !p.password || p.password.indexOf('{$') === 0) {
            throw 'Configurare {$NPM.CH.USER} e {$NPM.CH.PASSWORD}';
        }

        // LLD: la chiave resta proxy-host-ID. Dominio: host HTTP prevalente
        // osservato negli ultimi 7 giorni; non equivale al server_name canonico NPM.
        var sql = [
            "SELECT files.log_file AS log_file,",
            "  extract(files.log_file, '^proxy-host-([0-9]+)_access[.]log$') AS proxy_id,",
            "  if(length(dom.host_name) > 0, dom.host_name,",
            "     concat('proxy-host-', extract(files.log_file, '^proxy-host-([0-9]+)_access[.]log$'))) AS proxy_domain",
            "FROM (",
            "  SELECT DISTINCT Attributes['log.file.name'] AS log_file",
            "  FROM " + p.database + ".otel_metrics_sum",
            "  WHERE MetricName = 'npm.http.requests'",
            "    AND ServiceName = 'nginx-proxy-manager'",
            "    AND ResourceAttributes['host.name'] = {zbxhost:String}",
            "    AND TimeUnix >= now() - INTERVAL 7 DAY",
            "    AND match(Attributes['log.file.name'], '^proxy-host-[0-9]+_access[.]log$')",
            ") AS files",
            "LEFT JOIN (",
            "  SELECT log_file, argMax(host_name, hits) AS host_name",
            "  FROM (",
            "    SELECT Attributes['log.file.name'] AS log_file,",
            "      lowerUTF8(Attributes['http_host']) AS host_name,",
            "      sum(Value) AS hits",
            "    FROM " + p.database + ".otel_metrics_sum",
            "    WHERE MetricName = 'npm.http.host_requests'",
            "      AND ServiceName = 'nginx-proxy-manager'",
            "      AND ResourceAttributes['host.name'] = {zbxhost:String}",
            "      AND TimeUnix >= now() - INTERVAL 7 DAY",
            "      AND match(Attributes['http_host'], '^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$')",
            "      AND length(Attributes['http_host']) >= 4",
            "      AND position(Attributes['http_host'], '.') > 0",
            "    GROUP BY log_file, host_name",
            "  )",
            "  GROUP BY log_file",
            ") AS dom ON files.log_file = dom.log_file",
            "ORDER BY log_file",
            "FORMAT JSON"
        ].join('\n');

        var request = new HttpRequest();
        request.addHeader('Content-Type: text/plain; charset=utf-8');
        request.addHeader('X-ClickHouse-User: ' + p.user);
        request.addHeader('X-ClickHouse-Key: ' + p.password);
        var endpoint = p.url.replace(/\/+$/, '') +
            '/?wait_end_of_query=1&param_zbxhost=' + encodeURIComponent(p.host);
        var response = request.post(endpoint, sql);
        var status = request.getStatus();
        if (status !== 200) {
            throw 'ClickHouse HTTP ' + status + ' durante discovery proxy NPM';
        }
        var payload = JSON.parse(response);
        if (!Array.isArray(payload.data)) {
            throw 'Risposta ClickHouse priva di data';
        }
        var output = [];
        for (var i = 0; i < payload.data.length; i++) {
            var row = payload.data[i];
            if (!/^[0-9]+$/.test(String(row.proxy_id))) continue;
            var domain = String(row.proxy_domain || '').trim();
            if (domain.length > 150) domain = domain.substring(0, 150);
            output.push({
                '{#ZBX.HOST}': p.host,
                '{#NPM.ID}': String(row.proxy_id),
                '{#NPM.FILE}': String(row.log_file),
                '{#NPM.DOMAIN}': domain || ('proxy-host-' + row.proxy_id)
            });
        }
        return JSON.stringify(output);
      lifetime_type: DELETE_NEVER
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: 14d
      description: Rileva proxy ID dalle metriche requests degli ultimi 7 giorni; dominio mostrato = HTTP Host prevalente
        dal contatore npm.http.host_requests. Se mancante, fallback proxy-host-ID. Non interroga NPM API, quindi
        nomi non sempre canonici e soggetti al traffico. Credenziali ClickHouse tramite macro segreta.
      item_prototypes:
      - uuid: b228d7b8e96843a78b62010562dae8e3
