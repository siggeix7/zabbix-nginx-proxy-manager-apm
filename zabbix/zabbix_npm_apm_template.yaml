# Zabbix 8.0 template. UUID mantenuti per aggiornamenti importabili.
# Impostare {$NPM.CH.PASSWORD} in Zabbix come macro Secret text (valore escluso da Git).
zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  templates:
  - uuid: 62ca08d2ca8e4bb084708a75927776dd
    template: Zabbix APM Nginx Proxy Manager
    name: Zabbix APM Nginx Proxy Manager
    description: Monitoraggio APM di Nginx Proxy Manager su Zabbix 8.0 mediante OpenTelemetry Collector, Proxy OTLP/gRPC
      e ClickHouse. Include due discovery Script LLD, contatori HTTP per stato, metriche per proxy host, percentuali
      di errori, trigger e dashboard. Il campo resource host.name deve corrispondere al nome tecnico dell host Zabbix.
      Configurare le macro {$NPM.CH.URL}, {$NPM.CH.DATABASE}, {$NPM.CH.USER} e {$NPM.CH.PASSWORD} (Secret text).
      La seconda discovery mostra il dominio HTTP piu osservato per proxy host, che non e necessariamente il dominio
      canonico configurato in NPM.
    groups:
    - name: Templates/Applications
    discovery_rules:
    - uuid: acd064c75c2c4b5886d16540c239eacf
      name: 'Zabbix APM Nginx Proxy Manager: Host Discovery'
      type: SCRIPT
      key: apm.npm.host.discovery
      delay: 1h
      params: |
        var params = JSON.parse(value);
        var hostname = String(params.host || '').trim();

        if (!hostname || hostname === '{HOST.HOST}') {
            throw 'Impossibile risolvere il nome host Zabbix';
        }

        return JSON.stringify([
            {
                "{#ZBX.HOST}": hostname
            }
        ]);
      item_prototypes:
      - uuid: f954a374ef6f4fe3927f4b1b0054aef8
        name: 'Zabbix APM Nginx Proxy Manager: HTTP 2xx per minute - {#ZBX.HOST}'
        type: TELEMETRY_QUERY
        key: apm.npm.http.2xx["{#ZBX.HOST}"]
        description: Conteggio delle richieste NPM in intervalli di un minuto da metriche OTLP Delta. 0 indica assenza
          di record nel bucket consultato, non verifica disponibilita del servizio.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var rows = JSON.parse(value);
            if (!Array.isArray(rows)) {
                throw 'Telemetry query: risposta non valida (atteso array JSON)';
            }
            var sum = 0;
            for (var i = 0; i < rows.length; i++) {
                var n = Number(rows[i].requests || 0);
                if (!isFinite(n) || n < 0) {
                    throw 'Telemetry query: aggregato non numerico';
                }
                sum += n;
            }
            return Math.round(sum);
        time_shift: 30s
        lookback_limit: 10m
        granularity: 1m
        query:
          signal_type: METRICS
          aggregated_columns:
          - function: SUM
            column: Value
            alias: requests
          filter:
            evaltype: AND
            conditions:
            - column: MetricName
              value: npm.http.responses.2xx
            - column: ResourceAttributes
              attribute_key: host.name
              value: '{#ZBX.HOST}'
            - column: ServiceName
              value: nginx-proxy-manager
        tags:
        - tag: component
          value: npm
      - uuid: 5020143ba2ce43b0bfa3e53fecd9dbaf
