            }
            var sum = 0;
            for (var i = 0; i < rows.length; i++) {
                var n = Number(rows[i].requests || 0);
                if (!isFinite(n) || n < 0) {
                    throw 'Telemetry query: aggregato non numerico';
                }
                sum += n;
            }
            return Math.round(sum);
        time_shift: 30s
        lookback_limit: 10m
        granularity: 1m
        query:
          signal_type: METRICS
          aggregated_columns:
