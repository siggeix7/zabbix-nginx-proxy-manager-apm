      - uuid: ce90dd6ee69d40939ac7c897af56930f
        name: 'Zabbix APM Nginx Proxy Manager: {#NPM.DOMAIN} [proxy-host {#NPM.ID}]: HTTP requests per minute -
          {#ZBX.HOST}'
        type: TELEMETRY_QUERY
        key: apm.npm.proxy.http.requests["{#ZBX.HOST}","{#NPM.ID}"]
        description: Conteggio delle richieste NPM in intervalli di un minuto da metriche OTLP Delta. 0 indica assenza
          di record nel bucket consultato, non verifica disponibilita del servizio.
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var rows = JSON.parse(value);
            if (!Array.isArray(rows)) {
                throw 'Telemetry query: risposta non valida (atteso array JSON)';
            }
            var sum = 0;
            for (var i = 0; i < rows.length; i++) {
                var n = Number(rows[i].requests || 0);
                if (!isFinite(n) || n < 0) {
                    throw 'Telemetry query: aggregato non numerico';
                }
                sum += n;
            }
            return Math.round(sum);
        time_shift: 30s
        lookback_limit: 10m
        granularity: 1m
        query:
          signal_type: METRICS
          aggregated_columns:
          - function: SUM
            column: Value
            alias: requests
          filter:
            evaltype: AND
            conditions:
            - column: Attributes
              attribute_key: log.file.name
              value: '{#NPM.FILE}'
            - column: MetricName
              value: npm.http.requests
            - column: ResourceAttributes
              attribute_key: host.name
              value: '{#ZBX.HOST}'
            - column: ServiceName
              value: nginx-proxy-manager
        tags:
        - tag: component
          value: npm
        - tag: npm.scope
          value: proxy
        - tag: npm.proxy_id
          value: '{#NPM.ID}'
        - tag: npm.domain
          value: '{#NPM.DOMAIN}'
