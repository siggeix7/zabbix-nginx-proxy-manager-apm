            and sum(/Zabbix APM Nginx Proxy Manager/apm.npm.proxy.http.requests["{#ZBX.HOST}","{#NPM.ID}"],5m)>={$NPM.5XX.MIN_REQUESTS}
            and sum(/Zabbix APM Nginx Proxy Manager/apm.npm.proxy.http.5xx["{#ZBX.HOST}","{#NPM.ID}"],5m)>={$NPM.5XX.MIN_ERRORS}
          name: 'NPM {#NPM.DOMAIN} [proxy-host {#NPM.ID}] su {#ZBX.HOST}: percentuale HTTP 5xx elevata'
          priority: WARNING
