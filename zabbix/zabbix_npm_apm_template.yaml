      - uuid: d238688590f648009ef9ecf1382f389b
        name: 'Zabbix APM Nginx Proxy Manager: {#NPM.DOMAIN} [proxy-host {#NPM.ID}]: HTTP 4xx % (5m) - {#ZBX.HOST}'
        type: CALCULATED
        key: apm.npm.proxy.http.4xx.pct["{#ZBX.HOST}","{#NPM.ID}"]
        delay: 1m
        value_type: FLOAT
        units: '%'
        params: 100*sum(//apm.npm.proxy.http.4xx["{#ZBX.HOST}","{#NPM.ID}"],5m)/(sum(//apm.npm.proxy.http.requests["{#ZBX.HOST}","{#NPM.ID}"],5m)+0.001)
